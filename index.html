<style>
:root{--bg:#050505;--sf:#121110;--ln:#2d2924;--cr:#eadfce;--mu:#9a9084;--rd:#e1141c;--rs:4px;--sp:16px;--serif:"Bodoni Moda",Georgia,serif;--sans:Manrope,system-ui,sans-serif;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cr);font:400 15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}em{font-style:normal}
:focus-visible{outline:2px solid var(--cr);outline-offset:3px}[hidden]{display:none!important}
header.top{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--sat)) var(--sp) 22px;background:linear-gradient(#000d,transparent);pointer-events:none}
header.top>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:10px}.logo svg{width:34px;fill:var(--cr)}.logo span{font:500 15px var(--serif);letter-spacing:.3em}
.lk{color:var(--cr);font-weight:600;min-height:44px;padding:0 8px}
#app{padding-bottom:96px;min-height:100vh}#app.pad{padding-top:calc(76px + var(--sat))}
.wrap{padding:0 var(--sp);max-width:760px;margin:0 auto}
h1{font:700 32px/1.1 var(--serif);margin:18px 0 8px}p.sub{color:var(--mu);margin:0 0 20px}
label{display:block;font-weight:600;margin:14px 0 6px}
.in{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--rs);border:1px solid var(--ln);background:var(--sf);color:var(--cr);font:inherit}
textarea.in{min-height:90px}
.btn{min-height:48px;padding:0 24px;border-radius:var(--rs);font-weight:800;display:inline-flex;align-items:center;transition:transform .15s}.btn:active{transform:scale(.97)}
.pri{background:var(--cr);color:#050505}.sec{background:#ffffff1f;color:var(--cr)}.sec.on{color:var(--rd)}
.err{margin-top:14px;padding:12px 14px;border-left:3px solid var(--rd);background:var(--sf);color:#e8d4cf}
.hero{position:relative;height:70vh;min-height:430px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:var(--sp) var(--sp) 24px;background:#1a0c0d var(--img,linear-gradient(150deg,#5a1a1e,#050505)) center 15%/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 3%,#050505b0 30%,transparent 64%),linear-gradient(#000a,transparent 26%)}
.hero>*{position:relative;z-index:1}.hero h1{font-size:38px;margin:0;max-width:11em;text-shadow:0 2px 12px #000}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:#cfc5b6;font-size:13px}.acts{display:flex;gap:10px;margin-top:6px}
.row{margin:24px 0 0}.row h2{font:700 19px var(--serif);padding:0 var(--sp) 10px;margin:0}
.rail{display:flex;gap:8px;overflow-x:auto;padding:0 var(--sp);scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.pc{flex:none;width:110px;aspect-ratio:2/3;border-radius:var(--rs);overflow:hidden;position:relative;background:linear-gradient(160deg,#3a1618,#0b0b0b);display:flex;align-items:flex-end;padding:8px;font:700 13px/1.15 var(--serif)}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bar{display:block;height:3px;background:#2a2622;border-radius:2px;overflow:hidden}.bar u{display:block;height:100%;background:var(--rd)}
.pc .bar{position:absolute;left:0;right:0;bottom:0;border-radius:0;z-index:1}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 var(--sp)}.gr .pc{width:auto}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#050505f2;border-top:1px solid var(--ln);padding-bottom:var(--sab);z-index:7}
.nav button{flex:1;text-align:center;padding:14px 0;font-size:12px;font-weight:600;color:var(--mu);position:relative}
.nav .on{color:var(--cr)}.nav .on::before{content:"";position:absolute;top:-1px;left:50%;width:24px;margin-left:-12px;height:3px;background:var(--rd)}
.ph{padding:0 var(--sp)}.ph h1{margin:6px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px var(--sp);scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 14px;border:1px solid var(--ln);border-radius:20px;color:var(--mu);font-size:13px}.chips .on{border-color:var(--rd);color:var(--cr)}
.it{display:flex;gap:12px;align-items:center;width:100%;padding:10px var(--sp);border-bottom:1px solid #1a1815}
.th{flex:none;width:64px;aspect-ratio:16/10;border-radius:var(--rs);background:linear-gradient(150deg,#3a1618,#0a0a0a);overflow:hidden;display:flex;align-items:center;justify-content:center}.th img{width:100%;height:100%;object-fit:contain}
.it div{flex:1;min-width:0}.it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small{color:var(--mu)}
.fv{flex:none;width:44px;height:44px;text-align:center;color:var(--mu);font-size:20px}.fv.on{color:var(--rd)}
.empty{color:var(--mu);padding:30px var(--sp);max-width:30em}
.ov{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto}
.back{position:fixed;top:calc(8px + var(--sat));left:8px;z-index:11;width:44px;height:44px;border-radius:50%;background:#000a;text-align:center;font-size:22px}
.dp{padding:0 var(--sp) 40px}.syn{color:#cfc5b6;max-width:36em;margin:6px 0 0}
.sn{display:flex;gap:18px;border-bottom:1px solid var(--ln);margin:22px 0 4px;overflow-x:auto}.sn button{padding:9px 0;color:var(--mu);font-weight:600;white-space:nowrap}.sn .on{color:var(--cr);box-shadow:0 2px 0 var(--rd)}
.ep{display:flex;gap:12px;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid #1a1815}.ep b{display:block}.ep span{color:var(--mu);font-size:12px}.ep div{flex:1}.ep .bar{margin-top:6px}
#pl{position:fixed;inset:0;z-index:20;background:#000}#pl video{width:100%;height:100%;background:#000}
#pe{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000d;text-align:center;padding:30px}
body[data-m=d] .pc,body[data-m=t] .pc{width:var(--pw)}
body[data-m=d] .rail,body[data-m=t] .rail{padding:16px var(--pad);margin:-16px 0}
body[data-m=d] .row h2,body[data-m=d] .ph,body[data-m=d] .dp,body[data-m=d] .it,body[data-m=t] .row h2,body[data-m=t] .ph,body[data-m=t] .dp,body[data-m=t] .it{padding-left:var(--pad);padding-right:var(--pad)}
body[data-m=d] .chips,body[data-m=t] .chips{padding-left:var(--pad)}
body[data-m=d] .row h2,body[data-m=t] .row h2{font-size:calc(var(--fs)*1.5)}
body[data-m=d] .row,body[data-m=t] .row{margin-top:calc(var(--fs)*2)}
body[data-m=d] .gr,body[data-m=t] .gr{grid-template-columns:repeat(auto-fill,minmax(var(--pw),1fr));padding:0 var(--pad)}
body[data-m=d] .gr .pc,body[data-m=t] .gr .pc{width:auto}
body[data-m=d] .hero,body[data-m=t] .hero{height:76vh;min-height:520px;padding:var(--pad) var(--pad) 56px;background:#050505}
body[data-m=d] .hero::before,body[data-m=t] .hero::before{content:"";position:absolute;inset:-40px;background:var(--img,linear-gradient(150deg,#5a1a1e,#050505)) center/cover;filter:blur(30px) brightness(.5)}
body[data-m=d] .hero h1,body[data-m=t] .hero h1{font-size:calc(var(--fs)*3.2);max-width:12em}
body[data-m=d] .hp,body[data-m=t] .hp{display:block;position:absolute;right:var(--pad);top:calc(80px + var(--sat));bottom:60px;aspect-ratio:2/3;background:#1a1110 center/cover;border-radius:6px;box-shadow:0 20px 60px #000b;z-index:1}
body[data-m=d] .btn,body[data-m=t] .btn{min-height:calc(var(--fs)*3);padding:0 calc(var(--fs)*1.8);font-size:var(--fs)}
body[data-m=d] #app.pad,body[data-m=t] #app.pad{padding-top:calc(100px + var(--sat))}
body[data-m=d] #app,body[data-m=t] #app{padding-bottom:70px}
