name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Projeto Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www && cp aspect-player-v31.html www/index.html
          npx cap init Aspect com.aspect.player --web-dir=www
          npx cap add android
      - name: Patch nativo (tela cheia, notch, barras, PiP)
        run: python3 scripts/patch_android.py
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: aspect-apk, path: android/app/build/outputs/apk/debug/*.apk }
